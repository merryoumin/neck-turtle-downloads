name: Publish verified download links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-installers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public files and publish release links
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NeckTurtle-Setup-0.1.5-x64.exe NeckTurtle-0.1.5-mac-universal.dmg NeckTurtle-0.1.5-mac-universal.zip SHA256SUMS-0.1.5.txt; do
            curl --fail --silent --show-error --head "https://ttanjit.shop/downloads/turtle/$name" >/dev/null
          done
          curl --fail --silent --show-error 'https://ttanjit.shop/api/turtle/releases' -o release-status.json
          python3 - <<'PY'
          import json
          items=json.load(open('release-status.json'))['items']
          assert len(items)==2 and all(r['available'] and r['version']=='0.1.5' for r in items)
          print('Public bilingual v0.1.5 installer downloads and site release status verified.')
          PY
          cat > notes.md <<'NOTES'
          당신 목 빠지는 거북이 v0.1.5 — 공식 다운로드
          
          설치 파일은 TTANJIT의 공개 파일 저장소에서 바로 내려받습니다. 이 저장소에는 앱 원본 소스를 공개하지 않습니다.
          
          - [Windows 64비트 EXE](https://ttanjit.shop/downloads/turtle/NeckTurtle-Setup-0.1.5-x64.exe)
          - [Mac 공용 DMG](https://ttanjit.shop/downloads/turtle/NeckTurtle-0.1.5-mac-universal.dmg)
          - [Mac 공용 ZIP](https://ttanjit.shop/downloads/turtle/NeckTurtle-0.1.5-mac-universal.zip)
          - [SHA-256 검증값](https://ttanjit.shop/downloads/turtle/SHA256SUMS-0.1.5.txt)
          - [공식 사이트](https://ttanjit.shop/Turtle)
          
          Mac은 macOS 13 이상, Apple Silicon·Intel 공용 개발 테스트 파일입니다. Apple 공증은 아직 완료하지 않았으며 보안 경고가 남을 수 있습니다.
          한국어·영어 공용 파일입니다. 처음 실행할 때 언어를 선택하고 설정에서 언제든 바꿀 수 있습니다.
          Includes Korean and English. Choose your language on first launch or anytime in Settings.
          
          사전 서면 허락 없는 무단 재배포·변형·판매 및 상업적 유포를 금합니다. 본인 설치·실행, 법령상 예외 및 제3자 라이선스는 유지됩니다.
          NOTES
          if gh release view v0.1.5 --repo "$REPO" >/dev/null 2>&1; then
            gh release edit v0.1.5 --repo "$REPO" --draft=false --prerelease --title '당신 목 빠지는 거북이 v0.1.5' --notes-file notes.md
          else
            gh release create v0.1.5 --repo "$REPO" --target main --prerelease --title '당신 목 빠지는 거북이 v0.1.5' --notes-file notes.md
          fi
