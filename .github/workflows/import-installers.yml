name: Prepare installer release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-installers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare draft for direct installer uploads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.4 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Existing release retained.'
            exit 0
          fi
          cat > notes.md <<'NOTES'
          당신 목 빠지는 거북이 v0.1.4 — 개발 테스트 버전
          
          공식 설치 파일 전용 배포 저장소입니다. 앱 원본 소스를 포함하지 않습니다.
          Windows x64 EXE / macOS 13 이상 Apple Silicon·Intel 공용 DMG·ZIP.
          Mac은 Apple 공증 전 개발 테스트 버전입니다.
          
          사전 서면 허락 없는 무단 재배포·변형·판매 및 상업적 유포를 금합니다.
          개인 설치·실행, 법령상 예외 및 제3자 라이선스는 유지됩니다.
          
          관리자는 원본 v0.1.4의 EXE, DMG, ZIP, SHA256SUMS.txt 파일을 업로드한 뒤 공개해 주세요.
          NOTES
          gh release create v0.1.4 --repo "$REPO" --target main --draft --prerelease --title '당신 목 빠지는 거북이 v0.1.4' --notes-file notes.md
